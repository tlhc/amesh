[package]
name = "amesh"
version = "0.1.0"
edition = "2021"
description = "Local agent mesh for pi, Codex, and Claude Code."
license = "MIT"
authors = ["tlhc <tlhcd@outlook.com>"]
repository = "https://github.com/tlhc/amesh"
readme = "README.md"
keywords = ["mcp", "agents", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "amesh"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
